# Settings
- defaults:
    link:
      create: true
      relink: true
      force: true # Swap original file

# Clean remove dead symbolic links
- clean: ["~"]

# Run shell commands
- shell:
    # Install submodules
    - [git submodule update --init --recursive, Installing submodules]
    # Configure iTerm2 preference folder
    - [defaults write com.googlecode.iterm2 PrefsCustomFolder -string "$HOME/.dotfiles/iterm2" && defaults write com.googlecode.iterm2 LoadPrefsFromCustomFolder -bool true, Configuring iTerm2 preference folder]

# Symlink files
- link:
    # Zsh
    ~/.zshrc: zsh/zshrc.zsh
    ~/.zprofile: zsh/zprofile.zsh
    # Git
    ~/.gitconfig: git/gitconfig
    # Neovim
    ~/.config/nvim: nvim
    # VS Code
    ~/Library/Application Support/Code/User/settings.json: vscode/settings.json
    ~/Library/Application Support/Code/User/keybindings.json: vscode/keybindings.json
    # Cursor
    ~/Library/Application Support/Cursor/User/settings.json: cursor/settings.json
    ~/Library/Application Support/Cursor/User/keybindings.json: cursor/keybindings.json
    # Zed
    ~/.config/zed/settings.json: zed/settings.json
    ~/.config/zed/keymap.json: zed/keymap.json
    # SSH
    ~/.ssh/config: ssh/config
    # Global Git Ignore
    ~/.config/git/ignore: git/ignore
    # Starship
    ~/.config/starship.toml: starship/starship.toml
    # iTerm2 Dynamic Profiles
    ~/Library/Application Support/iTerm2/DynamicProfiles/omarchy-pure.json: iterm2/DynamicProfiles/omarchy-pure.json
